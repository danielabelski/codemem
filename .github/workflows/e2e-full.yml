# Temporary branch-only diagnostic. Do not merge this workflow into the release stack.
name: Completion Runtime Diagnostic

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: Isolated and parallel full-500 measurements
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare declared build prerequisites
        env:
          HOME: ${{ runner.temp }}/codemem-runtime-build
          CODEMEM_DB: ${{ runner.temp }}/codemem-runtime-build/mem.sqlite
          CODEMEM_KEYS_DIR: ${{ runner.temp }}/codemem-runtime-build/keys
          CODEMEM_CONFIG: ${{ runner.temp }}/codemem-runtime-build/config.json
          XDG_CONFIG_HOME: ${{ runner.temp }}/codemem-runtime-build/config
          XDG_DATA_HOME: ${{ runner.temp }}/codemem-runtime-build/data
        run: |
          node --input-type=module -e 'import {mkdirSync,copyFileSync} from "node:fs"; mkdirSync(process.env.HOME,{recursive:true}); mkdirSync("packages/viewer-server/static",{recursive:true}); for (const name of ["index.html","favicon.svg"]) copyFileSync(`packages/ui/static/${name}`,`packages/viewer-server/static/${name}`);'
          pnpm run build
      - name: Measure unchanged tests on this runner
        run: node scripts/diagnose-completion-runtime.mjs
      - name: Retain timings and failed assertions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: completion-runtime-diagnostic
          path: .tmp/completion-runtime-diagnostic
          if-no-files-found: error
          retention-days: 7
